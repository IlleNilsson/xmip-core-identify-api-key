[package]
name = "xmip-core-identify-api-key"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify-api-key"
description = "Identify by api-key: a key in a header or a query parameter, presented as its id and never as itself; a transport-layer claim, passed. A xmip-core-identify technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the identifier trait, the arrival and the claim live
# there. The mechanism it reads is declared once in xmip-core (ADR-0050).
identify = { workspace = true }
# The names the transport writes on the arrival (context::property).
context = { workspace = true }
xcore = { workspace = true }
# Percent-decoding a query parameter, strictly, as the estate reads it once;
# and the key never reaches the record: where it has no id of its own the
# claim is a prefix of its SHA-256 (codec::digest).
codec = { workspace = true }

[lints]
workspace = true
